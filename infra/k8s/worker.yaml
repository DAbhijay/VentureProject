apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ai-task-platform
spec:
  replicas: 3
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: your-dockerhub-user/ai-task-worker:latest
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          livenessProbe:
            exec: { command: ["python", "healthcheck.py"] }
            initialDelaySeconds: 20
          readinessProbe:
            exec: { command: ["python", "healthcheck.py"] }
            initialDelaySeconds: 10
