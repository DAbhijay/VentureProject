apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-task-platform
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: your-dockerhub-user/ai-task-backend:latest
          ports: [{ containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 20
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ai-task-platform
spec:
  selector: { app: backend }
  ports:
    - port: 4000
      targetPort: 4000
