name: backend-ci

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-task-backend:${{ github.sha }}
      - name: Update infra image tag
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/your-org/ai-task-platform-infra.git infra-repo
          sed -i "s|ai-task-backend:.*|ai-task-backend:${GITHUB_SHA}|" infra-repo/k8s/backend.yaml
          cd infra-repo
          git config user.email "github-actions@github.com"
          git config user.name "github-actions"
          git add k8s/backend.yaml
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "chore: update backend image ${GITHUB_SHA}" || true
          git push
