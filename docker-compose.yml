version: '3.9'
services:
  mongodb:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongodb_data:/data/db]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  backend:
    build: ./backend
    env_file: ./backend/.env.example
    ports: ['4000:4000']
    depends_on: [mongodb, redis]
  worker:
    build: ./worker
    env_file: ./worker/.env.example
    depends_on: [mongodb, redis]
  frontend:
    build: ./frontend
    env_file: ./frontend/.env.example
    ports: ['5173:80']
    depends_on: [backend]
volumes:
  mongodb_data:
